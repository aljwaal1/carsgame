name: Build Cars Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'legacy-android-4.4/**'
      - '.github/workflows/build-android-4.4.yml'

permissions:
  contents: write

concurrency:
  group: carsgame-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 30
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-30' 'build-tools;30.0.3'

      - name: Switch to Java 11 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Build APK
        working-directory: legacy-android-4.4
        run: gradle clean assembleRelease --stacktrace --no-daemon

      - name: Save APK
        run: |
          test -f legacy-android-4.4/app/build/outputs/apk/release/app-release.apk
          mkdir -p apk
          cp legacy-android-4.4/app/build/outputs/apk/release/app-release.apk apk/carsgame-android-4.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4
          path: apk/carsgame-android-4.4.apk

      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/carsgame-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Cars Game Android 4.4 APK'
            git push origin HEAD:android-4.4
          fi
