name: Build Cars Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_ANDROID_4_4.md'
      - 'ci-logs/**'
  pull_request:
    branches: [android-4.4]

permissions:
  contents: write

concurrency:
  group: carsgame-android-4-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Android 4.4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'android-4.4' }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
          test -s "$ANDROID_HOME/platforms/android-33/android.jar"

      - name: Prepare Android API 19 project
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          if [ -f android/app/build.gradle ]; then
            sed -Ei 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 33/' android/app/build.gradle
            sed -Ei 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 19/' android/app/build.gradle
            sed -Ei 's/applicationId[[:space:]]+"[^"]+"/applicationId "com.explapp.retrogamesar.legacy"/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -Ei 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 33/' android/app/build.gradle.kts
            sed -Ei 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 19/' android/app/build.gradle.kts
            sed -Ei 's/applicationId[[:space:]]*=[[:space:]]*"[^"]+"/applicationId = "com.explapp.retrogamesar.legacy"/' android/app/build.gradle.kts
          fi
          sed -i 's/android:label="retro_games_ar"/android:label="ألعاب زمان 4.4"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Show Android configuration
        shell: bash
        run: |
          set +e
          grep -RInE 'compileSdkVersion|compileSdk|minSdkVersion|minSdk|applicationId' android/app
          exit 0

      - name: Analyze legacy source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee carsgame-android-4.4-build.log

      - name: Save APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/carsgame-android-4.4.apk
          cat > DOWNLOAD_ANDROID_4_4.md <<'TXT'
          # تحميل ألعاب زمان لنظام Android 4.4

          https://github.com/aljwaal1/carsgame/raw/refs/heads/android-4.4/apk/carsgame-android-4.4.apk
          TXT
          sha256sum apk/carsgame-android-4.4.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4
          path: apk/carsgame-android-4.4.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4-build-log
          path: carsgame-android-4.4-build.log
          if-no-files-found: ignore

      - name: Commit APK or failure log
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          if [ -s apk/carsgame-android-4.4.apk ]; then
            git add apk/carsgame-android-4.4.apk DOWNLOAD_ANDROID_4_4.md
            git commit -m 'Build Cars Game Android 4.4 APK' || true
          elif [ -s carsgame-android-4.4-build.log ]; then
            mkdir -p ci-logs
            cp carsgame-android-4.4-build.log ci-logs/carsgame-android-4.4-failure.log
            git add ci-logs/carsgame-android-4.4-failure.log
            git commit -m 'ci: save Android 4.4 build failure log' || true
          fi
          git pull --rebase origin android-4.4
          git push origin HEAD:android-4.4
