name: Build Cars Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_ANDROID_4_4.md'

permissions:
  contents: write

concurrency:
  group: carsgame-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Android 4.4 branch
        uses: actions/checkout@v4
        with:
          ref: android-4.4
          fetch-depth: 0

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter 3.3.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          channel: stable
          cache: true

      - name: Prepare Android API 19 project
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms=android --org com.explapp .
          rm -rf test
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 19/' android/app/build.gradle
          sed -i 's/applicationId "com.example.retro_games_ar"/applicationId "com.explapp.retrogamesar.legacy"/' android/app/build.gradle
          sed -i 's/android:label="retro_games_ar"/android:label="ألعاب زمان 4.4"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Verify API 19 configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'minSdkVersion 19' android/app/build.gradle
          grep -n 'com.explapp.retrogamesar.legacy' android/app/build.gradle

      - name: Analyze legacy source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Save APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/carsgame-android-4.4.apk
          cat > DOWNLOAD_ANDROID_4_4.md <<'TXT'
          # تحميل ألعاب زمان لنظام Android 4.4

          https://github.com/aljwaal1/carsgame/raw/refs/heads/android-4.4/apk/carsgame-android-4.4.apk
          TXT
          sha256sum apk/carsgame-android-4.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4
          path: apk/carsgame-android-4.4.apk
          if-no-files-found: error

      - name: Commit APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/carsgame-android-4.4.apk DOWNLOAD_ANDROID_4_4.md
          if ! git diff --cached --quiet; then
            git commit -m 'Build Cars Game Android 4.4 APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
