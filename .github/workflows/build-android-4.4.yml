name: Build Cars Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'legacy-android-4.4/**'
      - '.github/workflows/build-android-4.4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 30
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.3'
      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Build APK
        working-directory: legacy-android-4.4
        run: gradle clean assembleRelease --stacktrace --no-daemon
      - name: Save APK
        run: |
          mkdir -p apk
          cp legacy-android-4.4/app/build/outputs/apk/release/app-release.apk apk/carsgame-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4
          path: apk/carsgame-android-4.4.apk
      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add apk/carsgame-android-4.4.apk
          git diff --cached --quiet || git commit -m 'Build Cars Game Android 4.4 APK'
          git push
