name: Build Cars Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['legacy-android-4.4/**', '.github/workflows/build-android-4.4.yml']

permissions:
  contents: write

concurrency:
  group: carsgame-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-30' 'build-tools;30.0.3' 'platform-tools'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Build signed debug APK
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 clean assembleDebug --stacktrace --info --no-daemon 2>&1 | tee carsgame-build.log
      - name: Save and verify APK
        run: |
          set -euo pipefail
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p apk
          cp "$APK" apk/carsgame-android-4.4.apk
          sha256sum apk/carsgame-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4
          path: apk/carsgame-android-4.4.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carsgame-android-4.4-build-log
          path: carsgame-build.log
          if-no-files-found: ignore
      - name: Persist build log on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          cp carsgame-build.log ci-logs/carsgame-android-4.4-failure.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-logs/carsgame-android-4.4-failure.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: persist Android 4.4 build failure log'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/carsgame-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build signed Cars Game Android 4.4 APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
